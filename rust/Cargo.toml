[workspace]
members = [
    "mimir-daemon",
    "mimir-permissions",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mimir"]
license = "Apache-2.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Clipboard
arboard = "3"
# Logging
log = "0.4"
env_logger = "0.11"
# UUID for request IDs
uuid = { version = "1", features = ["v4"] }
# Apple system frameworks (raw FFI)
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = { version = "0.24", features = ["highsierra"] }
